{% block js %}<script>

async function check() {
    console.log('titi');
    //var f = document.getElementById("frm");
    //f.setAttribute('method',"post");
    const my_streamer_game_uuid = document.getElementById("gameuuid").value;

    var response = await fetch('/validate_streamer_game_uuid',{
        method: 'POST',
        headers: {
                'Content-Type': 'application/json',
            },
        body: JSON.stringify({streamer_game_uuid: my_streamer_game_uuid}),
    })
    if(response.status == 502){
        console.log('Update failed');
        return;
    } else {
        var data = await response.json();
        //window.alert(data.result);
        if (data.result) {
            console.log('right UUID')
            window.alert("The game identifier you typed is valid.");
            
            //f.setAttribute('method',"post");
            /*
            f.setAttribute('action',"/watch");
            */
            window.location.href = '/watch';
            return false;
        } else {
            console.log('wrong UUID')

            window.alert("The game identifier you typed is invalid.");

            //f.setAttribute('action',"/type_game_uuid");
        }
    }

}
