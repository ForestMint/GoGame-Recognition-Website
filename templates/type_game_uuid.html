async function check() {
    console.log('titi');
    //var f = document.getElementById("frm");

    my_streamer_game_uuid = document.getElementById("gameuuid").value;

            window.location.href = url;
            return false;
        } else {
            console.log('wrong UUID')

            window.alert("The game identifier you typed is invalid.");

}
